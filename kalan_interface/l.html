<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>KALAN Logo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffffff;
    font-family:Arial, Helvetica, sans-serif;
}

.logo-container{
    text-align:center;
}

/* =========================
   LOGO
========================= */

.logo{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:22px;
    margin-bottom:18px;
}

/* ===== COMMON LETTER SIZE ===== */

.custom-letter{
    position:relative;
    width:145px;
    height:185px;
}

/* =========================
   K LETTER
========================= */

.k-letter .stem{
    position:absolute;
    left:0;
    width:28px;
    height:100%;
    background:#2b1207;
    border-radius:16px;
}

.k-letter .diag-top{
    position:absolute;
    width:28px;
    height:115px;
    background:#2b1207;
    border-radius:16px;
    left:62px;
    top:-4px;
    transform:rotate(48deg);
    transform-origin:bottom;
}

.k-letter .diag-bottom{
    position:absolute;
    width:28px;
    height:115px;
    background:#2b1207;
    border-radius:16px;
    left:62px;
    bottom:-4px;
    transform:rotate(-48deg);
    transform-origin:top;
}

/* =========================
   A LETTER
========================= */

.a-letter .left{
    position:absolute;
    width:30px;
    height:100%;
    background:#2b1207;
    border-radius:16px;
    left:26px;
    transform:skewX(-20deg);
}

.a-letter .right{
    position:absolute;
    width:30px;
    height:100%;
    background:#2b1207;
    border-radius:16px;
    right:26px;
    transform:skewX(20deg);
}

.a-letter .triangle{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:40px solid transparent;
    border-right:40px solid transparent;
    border-bottom:80px solid #556b1f;
}

.a-letter.orange .triangle{
    border-bottom-color:#d97b16;
}

/* =========================
   L LETTER
========================= */

.l-letter .vertical{
    position:absolute;
    width:30px;
    height:100%;
    background:#2b1207;
    border-radius:16px;
    left:0;
}

.l-letter .bottom{
    position:absolute;
    width:120px;
    height:30px;
    background:#2b1207;
    border-radius:16px;
    bottom:0;
    left:0;
}

/* =========================
   N LETTER
========================= */

.n-letter .left{
    position:absolute;
    width:30px;
    height:100%;
    background:#2b1207;
    border-radius:16px;
    left:0;
}

.n-letter .right{
    position:absolute;
    width:30px;
    height:100%;
    background:#2b1207;
    border-radius:16px;
    right:0;
}

.n-letter .middle{
    position:absolute;
    width:30px;
    height:100%;
    background:#2b1207;
    border-radius:16px;
    left:57px;
    transform:skewX(24deg);
}

/* =========================
   TAGLINE
========================= */

.tagline{
    color:#556b1f;
    font-size:30px;
    letter-spacing:10px;
    margin-top:8px;
    margin-bottom:45px;
    font-weight:500;
}

/* =========================
   DECORATION
========================= */

.decor{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
}

.line{
    width:220px;
    height:5px;
    border-radius:10px;
}

.line.green{
    background:#556b1f;
}

.line.orange{
    background:#d97b16;
}

.dot{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#b17b15;
}

.diamond{
    width:42px;
    height:42px;
    border:6px solid #d97b16;
    transform:rotate(45deg);
    display:flex;
    justify-content:center;
    align-items:center;
}

.diamond::after{
    content:"";
    width:14px;
    height:14px;
    background:#5a2b08;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .logo{
        gap:12px;
    }

    .custom-letter{
        width:75px;
        height:95px;
    }

    .k-letter .stem,
    .k-letter .diag-top,
    .k-letter .diag-bottom,
    .l-letter .vertical,
    .l-letter .bottom,
    .n-letter .left,
    .n-letter .right,
    .n-letter .middle,
    .a-letter .left,
    .a-letter .right{
        transform:scale(.5);
        transform-origin:top left;
    }

    .tagline{
        font-size:12px;
        letter-spacing:4px;
    }

    .line{
        width:80px;
        height:3px;
    }

    .diamond{
        width:22px;
        height:22px;
        border-width:4px;
    }

    .diamond::after{
        width:8px;
        height:8px;
    }
}

</style>
</head>

<body>

<div class="logo-container">

    <div class="logo">

        <!-- K -->
        <div class="custom-letter k-letter">
            <div class="stem"></div>
            <div class="diag-top"></div>
            <div class="diag-bottom"></div>
        </div>

        <!-- A -->
        <div class="custom-letter a-letter">
            <div class="left"></div>
            <div class="right"></div>
            <div class="triangle"></div>
        </div>

        <!-- L -->
        <div class="custom-letter l-letter">
            <div class="vertical"></div>
            <div class="bottom"></div>
        </div>

        <!-- A -->
        <div class="custom-letter a-letter orange">
            <div class="left"></div>
            <div class="right"></div>
            <div class="triangle"></div>
        </div>

        <!-- N -->
        <div class="custom-letter n-letter">
            <div class="left"></div>
            <div class="middle"></div>
            <div class="right"></div>
        </div>

    </div>

    <div class="tagline">
        LE SAVOIR QUI GRANDIT AVEC TOI
    </div>

    <div class="decor">

        <div class="line green"></div>

        <div class="dot"></div>

        <div class="diamond"></div>

        <div class="dot"></div>

        <div class="line orange"></div>

    </div>

</div>

</body>
</html>
