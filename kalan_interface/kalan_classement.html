
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#C8B89A;display:flex;justify-content:center;font-family:'Nunito',sans-serif;}
.phone{width:375px;background:#F8F4EC;border-radius:44px;border:10px solid #111;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,0.5);}

.sb{background:#F8F4EC;padding:14px 24px 8px;display:flex;justify-content:space-between;align-items:center;}
.sb-time{font-size:15px;font-weight:900;color:#1A1A1A;}

.band{height:48px;background:#3D2008;overflow:hidden;}

/* HEADER */
.header{background:#F8F4EC;padding:14px 22px 16px;text-align:center;}
.header-title{font-size:26px;font-weight:900;color:#2D5C14;}

/* TABS */
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px;padding:0 22px;}
.tab{flex:1;padding:9px 0;border-radius:12px;font-size:13px;font-weight:800;text-align:center;cursor:pointer;border:none;font-family:'Nunito',sans-serif;transition:all .15s;}
.tab.active{background:#2D5C14;color:#fff;box-shadow:0 3px 10px rgba(45,92,20,0.3);}
.tab.inactive{background:#EDE5D0;color:#8A7A58;}
.tab.inactive:hover{background:#E0D8C0;}

/* PODIUM */
.podium-area{padding:0 22px 20px;display:flex;align-items:flex-end;justify-content:center;gap:10px;}

.podium-item{display:flex;flex-direction:column;align-items:center;gap:6px;}

/* Avatar podium */
.pav{position:relative;}
.pav-circle{border-radius:50%;overflow:hidden;border:3px solid #EDE5D0;}
.pav-circle.first{width:72px;height:72px;border-color:#F5C842;border-width:3px;}
.pav-circle.second{width:60px;height:60px;border-color:#C0C0C0;}
.pav-circle.third{width:60px;height:60px;border-color:#CD7F32;}
.crown{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:22px;}

.pav-name{font-size:13px;font-weight:900;color:#2A1A08;text-align:center;}
.pav-xp{font-size:12px;font-weight:700;color:#5A8A20;text-align:center;}

/* Bloc podium */
.pblock{border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:center;width:90px;}
.pblock.first{height:80px;background:linear-gradient(180deg,#F5C842,#E8A820);color:#fff;font-size:28px;font-weight:900;}
.pblock.second{height:60px;background:linear-gradient(180deg,#D0D0D0,#B0B0B0);color:#fff;font-size:22px;font-weight:900;}
.pblock.third{height:48px;background:linear-gradient(180deg,#CD9060,#A06040);color:#fff;font-size:20px;font-weight:900;}

/* LISTE */
.list{padding:0 22px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}

.list-item{background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,0.06);border:1.5px solid transparent;}
.list-item.me{background:#EDF5E0;border-color:#2D5C14;}

.rank-num{font-size:15px;font-weight:900;color:#8A7A58;width:22px;text-align:center;flex-shrink:0;}
.list-av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.list-name{flex:1;font-size:15px;font-weight:800;color:#2A1A08;}
.list-name.me{color:#2D5C14;}
.list-xp{font-size:13px;font-weight:900;color:#5A8A20;}

/* BOTTOM NAV */
.bottomnav{background:#F8F4EC;padding:10px 0 6px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #EDE5D0;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1;}
.nav-item span{font-size:10px;font-weight:700;color:#B0A080;}
.nav-item.active span{color:#2D5C14;}
.nav-fab{width:50px;height:50px;background:#2D5C14;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(45,92,20,0.4);margin-top:-16px;}
</style>

<script>
function drawBand(id){
  const wrap=document.getElementById(id);
  const c=document.createElement('canvas');
  c.width=375;c.height=48;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#3D2008';
  ctx.fillRect(0,0,375,48);
  const s=24;
  for(let col=0;col<17;col++){
    for(let row=0;row<2;row++){
      const x=col*s,y=row*s;
      ctx.beginPath();
      ctx.moveTo(x+s/2,y);ctx.lineTo(x+s,y+s/2);
      ctx.lineTo(x+s/2,y+s);ctx.lineTo(x,y+s/2);
      ctx.closePath();
      ctx.strokeStyle='rgba(210,150,30,0.7)';
      ctx.lineWidth=1;ctx.stroke();
      if((col+row)%2===0){ctx.fillStyle='rgba(196,130,20,0.25)';ctx.fill();}
      ctx.beginPath();ctx.arc(x+s/2,y+s/2,2,0,Math.PI*2);
      ctx.fillStyle='rgba(230,170,50,0.6)';ctx.fill();
    }
  }
  wrap.innerHTML='';wrap.appendChild(c);
}
drawBand('topBand');
drawBand('botBand');

// Tab switching
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(x=>{x.className='tab inactive';});
    this.className='tab active';
  });
});
</script>
