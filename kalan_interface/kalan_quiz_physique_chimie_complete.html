<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALAN - Quiz Physique-Chimie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #e8e0d0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        :root {
            --color-background-secondary: #e8e0d0;
            --border-radius-lg: 20px;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body>

<div style="display:flex;justify-content:center;background:var(--color-background-secondary);padding:16px;border-radius:var(--border-radius-lg);min-height:700px;">
<div style="width:360px;background:#F5F2EA;border-radius:36px;overflow:hidden;font-family:var(--font-sans);position:relative;min-height:820px;">

  <!-- Status bar -->
  <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 22px 4px;background:#fff;">
    <span style="font-size:13px;font-weight:600;color:#1a1a1a;">9:41</span>
    <div style="display:flex;align-items:center;gap:5px;">
      <svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="4" width="3" height="7" rx="1" fill="#1a1a1a"/><rect x="4.5" y="2.5" width="3" height="8.5" rx="1" fill="#1a1a1a"/><rect x="9" y="0.5" width="3" height="10.5" rx="1" fill="#1a1a1a"/><rect x="13.5" y="0" width="2.5" height="11" rx="1" fill="#1a1a1a" opacity=".3"/></svg>
      <svg width="15" height="12" viewBox="0 0 16 12"><path d="M8 3C10.2 3 12.2 3.9 13.6 5.4L15 4C13.2 2.1 10.7 1 8 1 5.3 1 2.8 2.1 1 4l1.4 1.4C3.8 3.9 5.8 3 8 3z" fill="#1a1a1a"/><path d="M8 6C9.4 6 10.7 6.6 11.6 7.6L13 6.2C11.7 4.8 10 4 8 4s-3.7.8-5 2.2L4.4 7.6C5.3 6.6 6.6 6 8 6z" fill="#1a1a1a"/><circle cx="8" cy="10" r="1.5" fill="#1a1a1a"/></svg>
      <div style="width:22px;height:11px;border:1.5px solid #1a1a1a;border-radius:3px;padding:1.5px;display:flex;align-items:center;">
        <div style="width:75%;height:100%;background:#1a1a1a;border-radius:1.5px;"></div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 8px;background:#fff;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;border-radius:50%;background:#E8E4DA;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <span style="font-size:15px;font-weight:700;color:#1a1a1a;">Quiz : Physique-Chimie</span>
    </div>
  </div>

  <!-- Progress bar + counter -->
  <div style="padding:4px 20px 18px;background:#fff;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
      <span style="font-size:12px;color:#aaa;">Question 4/10</span>
      <span style="font-size:12px;color:#2D6A2D;font-weight:600;">3 correctes</span>
    </div>
    <div style="height:6px;background:#D8D4C8;border-radius:10px;overflow:hidden;">
      <div style="width:40%;height:100%;background:#2D6A2D;border-radius:10px;"></div>
    </div>
  </div>

  <!-- Question card -->
  <div style="padding:0 16px 20px;background:#fff;">
    <div style="background:#fff;border-radius:20px;padding:26px 22px;border:0.5px solid rgba(0,0,0,0.06);">
      <p style="font-size:17px;font-weight:700;color:#1a1a1a;margin:0;line-height:1.5;">Quelle est la formule de l'eau ?</p>
    </div>
  </div>

  <!-- Answer options -->
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px;background:#fff;">

    <!-- Option A -->
    <div style="background:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;border:0.5px solid rgba(0,0,0,0.08);cursor:pointer;">
      <div style="width:30px;height:30px;border-radius:50%;border:1.5px solid #D0CCC0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <span style="font-size:13px;font-weight:600;color:#888;">A</span>
      </div>
      <span style="font-size:15px;color:#1a1a1a;">CO₂</span>
    </div>

    <!-- Option B — selected + correct -->
    <div style="background:#EAF3DE;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;border:1.5px solid #2D6A2D;cursor:pointer;">
      <div style="width:30px;height:30px;border-radius:50%;background:#2D6A2D;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <span style="font-size:13px;font-weight:700;color:#fff;">B</span>
      </div>
      <span style="font-size:15px;font-weight:600;color:#27500A;">H₂O</span>
      <div style="margin-left:auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D6A2D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
    </div>

    <!-- Option C -->
    <div style="background:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;border:0.5px solid rgba(0,0,0,0.08);cursor:pointer;">
      <div style="width:30px;height:30px;border-radius:50%;border:1.5px solid #D0CCC0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <span style="font-size:13px;font-weight:600;color:#888;">C</span>
      </div>
      <span style="font-size:15px;color:#1a1a1a;">O₂</span>
    </div>

    <!-- Option D -->
    <div style="background:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;border:0.5px solid rgba(0,0,0,0.08);cursor:pointer;">
      <div style="width:30px;height:30px;border-radius:50%;border:1.5px solid #D0CCC0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <span style="font-size:13px;font-weight:600;color:#888;">D</span>
      </div>
      <span style="font-size:15px;color:#1a1a1a;">HO₂</span>
    </div>

  </div>

  <!-- Suivant button -->
  <div style="padding:24px 16px 90px;background:#fff;">
    <div style="background:#2D6A2D;border-radius:50px;padding:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <span style="font-size:15px;font-weight:600;color:#fff;">Suivant</span>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div style="position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid rgba(0,0,0,0.08);padding:10px 0 20px;display:flex;justify-content:space-around;align-items:flex-end;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span style="font-size:10px;color:#aaa;">Accueil</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      <span style="font-size:10px;color:#aaa;">Mes cartes</span>
    </div>
    <div style="width:54px;height:54px;background:#2D6A2D;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;border:3px solid #F5F2EA;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M20.94 11A8.994 8.994 0 0 0 12 3a8.994 8.994 0 0 0-8.94 8"/><path d="M3.06 13A8.994 8.994 0 0 0 12 21a8.994 8.994 0 0 0 8.94-8"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D6A2D" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17" stroke-width="3"/></svg>
      <span style="font-size:10px;color:#2D6A2D;font-weight:600;">Quiz</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size:10px;color:#aaa;">Profil</span>
    </div>
  </div>

</div>
</div>

</body>
</html>
