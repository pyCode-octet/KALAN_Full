<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALAN - Connexion</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Nunito',sans-serif;
      background:#D6C9B0;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      min-height:100vh;
    }

    .phone{
      width:375px;
      background:#F5EDD8;
      border-radius:44px;
      border:10px solid #1A1A1A;
      overflow:hidden;
      box-shadow:0 40px 100px rgba(0,0,0,0.4);
      padding-bottom:25px;
      position:relative;
    }

    .bg{
      position:absolute;
      inset:0;
      z-index:0;
    }

    .bg-color{
      position:absolute;
      inset:0;
      background:#F5EDD8;
    }

    .bg-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
    }

    .rel{
      position:relative;
      z-index:2;
    }

    .status-bar{
      display:flex;
      justify-content:space-between;
      padding:14px 24px 6px;
      font-weight:900;
      font-size:15px;
      color:#1A1A1A;
    }

    .logo{
      text-align:center;
      margin-top:10px;
    }

    .logo img{
      width:94px;
      height:94px;
      object-fit:contain;
    }

    .logo h1{
      font-size:40px;
      color:#2D5C14;
      letter-spacing:5px;
      font-style:italic;
      line-height:1;
      margin-top:4px;
    }

    .logo p{
      color:#2D5C14;
      margin-top:6px;
      font-weight:700;
      font-style:italic;
      font-size:12px;
      letter-spacing:1px;
    }

    .content{
      padding:0 24px;
      margin-top:50px;
    }

    h2{
      text-align:center;
      color:#2D5C14;
      font-size:27px;
      font-weight:900;
      margin-bottom:12px;
    }

    .desc{
      text-align:center;
      color:#8A7A58;
      line-height:1.6;
      margin-bottom:30px;
      font-size:14px;
      font-weight:600;
    }

    .input-box{
      border:2px solid #D8CFBA;
      border-radius:14px;
      padding:14px 18px;
      margin-bottom:24px;
      background:white;
    }

    .input-box input{
      width:100%;
      border:none;
      outline:none;
      font-size:15px;
      font-family:'Nunito',sans-serif;
      font-weight:700;
      color:#3A2810;
      background:transparent;
    }

    .input-box input::placeholder{
      color:#C0B080;
      font-weight:600;
    }

    .button{
      width:100%;
      border:none;
      background:#2D5C14;
      color:white;
      padding:17px 24px;
      border-radius:50px;
      font-size:17px;
      font-weight:900;
      margin-top:20px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-shadow:0 5px 18px rgba(45,96,16,0.38);
      transition:all .15s;
    }

    .button:hover{
      background:#3A7A18;
      transform:translateY(-1px);
    }

    .button .arr{
      background:rgba(255,255,255,0.2);
      width:32px;
      height:32px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .button-inv{
      width:100%;
      background:#fff;
      color:#3A2810;
      border:1.5px solid #C8BFA8;
      border-radius:50px;
      padding:15px 24px;
      font-size:15px;
      font-weight:800;
      font-family:'Nunito',sans-serif;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin-top:12px;
      transition:all .15s;
    }

    .button-inv:hover{
      background:#F5F0E8;
    }

    .avatar-display{
      display:flex;
      flex-direction:column;
      align-items:center;
      margin-bottom:30px;
    }

    .avatar-img{
      width:80px;
      height:80px;
      border-radius:50%;
      border:3px solid #2D5C14;
      object-fit:cover;
      margin-bottom:12px;
    }

    .avatar-name{
      font-size:18px;
      font-weight:700;
      color:#2D5C14;
    }

    .back{
      font-size:28px;
      color:#2D5C14;
      padding:0 22px;
      cursor:pointer;
    }

    .signup-link{
      text-align:center;
      margin-top:20px;
      font-size:14px;
      font-weight:600;
      color:#8A7A58;
    }

    .signup-link a{
      color:#2D5C14;
      font-weight:800;
      text-decoration:none;
      cursor:pointer;
    }

    .signup-link a:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="bg">
    <div class="bg-color"></div>
    <svg class="bg-svg" viewBox="0 0 375 820" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="fili" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
          <polyline points="4,4 20,20 4,36" fill="none" stroke="#8B6914" stroke-width="1.3"/>
          <polyline points="14,4 30,20 14,36" fill="none" stroke="#8B6914" stroke-width="1.3"/>
          <polyline points="24,4 40,20 24,36" fill="none" stroke="#8B6914" stroke-width="1.3"/>
          <polygon points="60,10 72,22 60,34 48,22" fill="none" stroke="#8B6914" stroke-width="1.3"/>
          <circle cx="60" cy="22" r="2.5" fill="#8B6914"/>
          <polyline points="4,46 20,62 4,78" fill="none" stroke="#8B6914" stroke-width="1.3"/>
          <polyline points="14,46 30,62 14,78" fill="none" stroke="#8B6914" stroke-width="1.3"/>
          <polygon points="60,50 72,62 60,74 48,62" fill="none" stroke="#8B6914" stroke-width="1.3"/>
        </pattern>
      </defs>
      <rect width="375" height="820" fill="url(#fili)" opacity="0.13"/>
    </svg>
  </div>

  <div class="rel">
    <div class="status-bar">
      <span>9:41</span>
      <div style="display:flex;gap:5px;align-items:center;">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#1A1A1A"><rect x="0" y="5" width="2.5" height="7" rx="1"/><rect x="4" y="3" width="2.5" height="9" rx="1"/><rect x="8" y="1" width="2.5" height="11" rx="1"/><rect x="12" y="0" width="2.5" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="#1A1A1A"><path d="M8 3C5.8 3 3.8 3.9 2.3 5.4L0.9 3.9C2.8 2 5.3 1 8 1s5.2 1 7.1 2.9l-1.4 1.5C12.2 3.9 10.2 3 8 3z"/><path d="M8 6.5c-1.4 0-2.7.6-3.6 1.5L3 6.6C4.2 5.3 6 4.5 8 4.5s3.8.8 5 2.1l-1.4 1.4C10.7 7.1 9.4 6.5 8 6.5z"/><circle cx="8" cy="10.5" r="1.5"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".6" y=".6" width="21.8" height="10.8" rx="3" stroke="#1A1A1A" stroke-width="1.2"/><rect x="23" y="3.5" width="2.5" height="5" rx="1.2" fill="#1A1A1A"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#1A1A1A"/></svg>
      </div>
    </div>

    <div class="back" onclick="window.location.href='kalan_inscription_v4.html'">←</div>

    <div class="logo">
      <img src="kalan_logo.png" alt="KALAN Logo">
      <h1>KALAN</h1>
      <p>Le savoir qui grandit avec toi</p>
    </div>

    <div class="content">
      <h2>Bon retour !</h2>

      <p class="desc">
        Connecte-toi avec ton pseudo pour continuer ton aventure.
      </p>

      <div class="avatar-display" id="avatarDisplay" style="display:none;">
        <img class="avatar-img" id="avatarImg" src="" alt="Avatar">
        <div class="avatar-name" id="avatarName"></div>
      </div>

      <div class="input-box">
        <input type="text" placeholder="Ton pseudo" id="pseudo">
      </div>

      <button class="button" onclick="go()">
        <span>Se connecter</span>
        <span class="arr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>
      </button>

      <button class="button-inv">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A2810" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Jouer en mode invité
      </button>

      <p class="signup-link">
        Pas de compte ? <a onclick="window.location.href='kalan_inscription_v4.html'">S'inscrire</a>
      </p>
    </div>
  </div>
</div>

<script>
// Charger les données sauvegardées
document.addEventListener('DOMContentLoaded', function() {
  const savedPseudo = localStorage.getItem('kalan_pseudo');
  const savedAvatar = localStorage.getItem('kalan_avatar');
  
  if (savedPseudo) {
    document.getElementById('pseudo').value = savedPseudo;
  }
  
  if (savedPseudo && savedAvatar) {
    const avatarDisplay = document.getElementById('avatarDisplay');
    const avatarImg = document.getElementById('avatarImg');
    const avatarName = document.getElementById('avatarName');
    
    // Afficher l'avatar correspondant
    const avatarUrls = [
      'https://cdn.jsdelivr.net/gh/alohe/avatars/png/upstream_1.png',
      'https://cdn.jsdelivr.net/gh/alohe/avatars/png/upstream_2.png',
      'https://cdn.jsdelivr.net/gh/alohe/avatars/png/upstream_3.png',
      'https://cdn.jsdelivr.net/gh/alohe/avatars/png/upstream_4.png',
      'https://cdn.jsdelivr.net/gh/alohe/avatars/png/upstream_5.png',
      'https://cdn.jsdelivr.net/gh/alohe/avatars/png/upstream_6.png',
      'https://cdn.jsdelivr.net/gh/alohe/avatars/png/upstream_7.png',
      'https://cdn.jsdelivr.net/gh/alohe/avatars/png/upstream_8.png'
    ];
    
    avatarImg.src = avatarUrls[savedAvatar - 1] || avatarUrls[0];
    avatarName.textContent = savedPseudo;
    avatarDisplay.style.display = 'flex';
  }
});

function go() {
  const pseudo = document.getElementById('pseudo').value;
  
  if (!pseudo || pseudo.trim() === '') {
    alert('Entre ton pseudo !');
    return;
  }
  
  // Sauvegarder le pseudo
  localStorage.setItem('kalan_pseudo', pseudo);
  
  // Rediriger vers l'accueil
  window.location.href = 'GOOG_PAGE/kalan_accueil_aminata_complete.html';
}
</script>

</body>
</html>
