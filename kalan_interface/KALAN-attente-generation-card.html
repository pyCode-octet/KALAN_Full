<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALAN - Génération IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f6f2; overflow: hidden; }
        
        /* Animation de flottement pour le filigrane */
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(15px, -20px) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .floating-icon {
            position: absolute;
            opacity: 0.08;
            animation: float 8s ease-in-out infinite;
            z-index: 0;
        }

        /* Pulsation de l'arbre central */
        @keyframes pulse-glow {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(46, 125, 50, 0)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(46, 125, 50, 0.3)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(46, 125, 50, 0)); }
        }
        .ai-core { animation: pulse-glow 3s ease-in-out infinite; }

        /* Slide up pour les étapes */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .step-item { opacity: 0; animation: slideIn 0.5s forwards; }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #FDFCF8;
            border: 12px solid #1a1a1a;
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen">

    <div class="phone-frame">
        <!-- FILIGRANES AMUSANTS DANS LE FOND -->
        <span class="floating-icon text-4xl" style="top: 10%; left: 10%; animation-delay: 0s;">🌿</span>
        <span class="floating-icon text-5xl" style="top: 15%; right: 15%; animation-delay: 2s;">📐</span>
        <span class="floating-icon text-3xl" style="bottom: 20%; left: 20%; animation-delay: 4s;">🌍</span>
        <span class="floating-icon text-4xl" style="bottom: 10%; right: 10%; animation-delay: 1s;">🧪</span>

        <div class="relative z-10 h-full flex flex-col p-8">
            
            <!-- Header -->
            <div class="mt-8 text-center">
                <h2 class="text-2xl font-extrabold text-gray-800">Génération en cours...</h2>
                <p class="text-sm text-gray-500 font-medium mt-2">L'IA KALAN transforme ton cours en succès</p>
            </div>

            <!-- Central AI Animation -->
            <div class="flex-1 flex flex-col justify-center items-center">
                <div class="relative w-48 h-48 flex justify-center items-center">
                    <!-- Cercle rotatif extérieur -->
                    <div class="absolute inset-0 border-4 border-dashed border-green-200 rounded-full animate-[spin_10s_linear_infinite]"></div>
                    <!-- Logo KALAN pulsant -->
                    <div class="ai-core bg-white p-6 rounded-full shadow-xl border border-green-50">
                        <img src="./interfaces/logo.jpeg" class="w-40 h-40 object-contain">
                    </div>
                </div>
            </div>

            <!-- Étapes de progression (FP3.7) -->
            <div class="space-y-4 mb-12">
                <div class="step-item flex items-center gap-4" style="animation-delay: 0.5s;">
                    <div class="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center text-white text-[10px]">✓</div>
                    <span class="text-sm font-bold text-gray-700">Analyse du texte (OCR)</span>
                </div>
                <div class="step-item flex items-center gap-4" style="animation-delay: 1.5s;">
                    <div class="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center text-white text-[10px]">✓</div>
                    <span class="text-sm font-bold text-gray-700">Extraction des idées clés</span>
                </div>
                <div class="step-item flex items-center gap-4" style="animation-delay: 2.5s;">
                    <div class="w-6 h-6 bg-green-100 rounded-full flex items-center justify-center">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-ping"></div>
                    </div>
                    <span class="text-sm font-bold text-green-600">Création des flashcards...</span>
                </div>
                <div class="step-item flex items-center gap-4 opacity-30" style="animation-delay: 3.5s;">
                    <div class="w-6 h-6 bg-gray-100 rounded-full"></div>
                    <span class="text-sm font-bold text-gray-400">Génération des quiz adaptatifs</span>
                </div>
            </div>

            <!-- Bouton Annuler discret -->
            <button class="py-4 text-gray-400 text-xs font-black uppercase tracking-widest hover:text-red-400 transition-colors">
                Annuler la génération
            </button>
        </div>
    </div>

</body>
</html>
