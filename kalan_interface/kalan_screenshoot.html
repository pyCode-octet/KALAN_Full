<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALAN — Scanner</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #D8D0C0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Phone shell ── */
    .phone {
      width: 390px;
      height: 844px;
      background: #FAF7F0;
      border-radius: 50px;
      border: 10px solid #1A1A1A;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 0 0 1px #333,
        0 30px 80px rgba(0,0,0,0.4),
        inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    /* Notch */
    .notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 126px; height: 34px;
      background: #1A1A1A;
      border-radius: 0 0 22px 22px;
      z-index: 50;
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 42px 24px 0;
      flex-shrink: 0;
    }
    .status-time { font-size: 15px; font-weight: 700; color: #1A1A1A; letter-spacing: -0.3px; }
    .status-icons { display: flex; align-items: center; gap: 6px; }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 10px;
      flex-shrink: 0;
    }
    .back-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.06);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border: none;
    }
    .logo-wrap { display: flex; align-items: center; gap: 8px; }
    .logo-text { font-size: 18px; font-weight: 900; color: #1A4D2E; letter-spacing: -0.5px; }
    .spacer { width: 36px; }

    /* ── Tab switcher ── */
    .tab-bar {
      display: flex;
      gap: 8px;
      padding: 0 20px 14px;
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all .2s;
    }
    .tab-btn.active {
      background: #2E7D32;
      color: #fff;
      box-shadow: 0 4px 12px rgba(46,125,50,0.3);
    }
    .tab-btn.inactive {
      background: #EDE8DC;
      color: #888;
    }

    /* ── Camera viewfinder ── */
    .viewfinder-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      position: relative;
    }

    .viewfinder {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 20px;
      background: #E8E2D6;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 32px; height: 32px;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: #2E7D32;
      border-radius: 2px;
    }
    .corner.tl { top: 16px; left: 16px; }
    .corner.tl::before { top: 0; left: 0; width: 3px; height: 32px; }
    .corner.tl::after  { top: 0; left: 0; width: 32px; height: 3px; }

    .corner.tr { top: 16px; right: 16px; }
    .corner.tr::before { top: 0; right: 0; width: 3px; height: 32px; }
    .corner.tr::after  { top: 0; right: 0; width: 32px; height: 3px; }

    .corner.bl { bottom: 16px; left: 16px; }
    .corner.bl::before { bottom: 0; left: 0; width: 3px; height: 32px; }
    .corner.bl::after  { bottom: 0; left: 0; width: 32px; height: 3px; }

    .corner.br { bottom: 16px; right: 16px; }
    .corner.br::before { bottom: 0; right: 0; width: 3px; height: 32px; }
    .corner.br::after  { bottom: 0; right: 0; width: 32px; height: 3px; }

    /* Camera icon center */
    .cam-icon-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .cam-icon-bg {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
    }

    /* Scan line animation */
    .scan-line {
      position: absolute;
      left: 16px; right: 16px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #2E7D32, transparent);
      border-radius: 2px;
      animation: scan 2.5s ease-in-out infinite;
      opacity: 0.7;
    }
    @keyframes scan {
      0%   { top: 16px; opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.8; }
      100% { top: calc(100% - 16px); opacity: 0; }
    }

    /* Helper text */
    .helper-text {
      text-align: center;
      margin-top: 16px;
    }
    .helper-text p:first-child {
      font-size: 15px;
      font-weight: 700;
      color: #1A1A1A;
    }
    .helper-text p:last-child {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    /* ── Camera controls ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px 24px;
      flex-shrink: 0;
    }

    /* Flash button */
    .ctrl-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(0,0,0,0.07);
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s;
    }
    .ctrl-btn:hover { background: rgba(0,0,0,0.12); }

    /* Capture button */
    .capture-btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #2E7D32;
      border: 5px solid #FAF7F0;
      outline: 2px solid #2E7D32;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(46,125,50,0.4);
      transition: transform .15s, box-shadow .15s;
    }
    .capture-btn:active { transform: scale(0.95); box-shadow: 0 3px 10px rgba(46,125,50,0.3); }
    .capture-inner {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: #2E7D32;
    }

    /* ── Bottom nav ── */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px 24px;
      background: #fff;
      border-top: 1px solid #EEE8DC;
      flex-shrink: 0;
    }
    .nav-item {
      display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      flex: 1; color: #AAAAAA;
      font-size: 10px; font-weight: 600;
      cursor: pointer;
    }
    .nav-item.active { color: #2E7D32; }

    .nav-cam-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #2E7D32;
      display: flex; align-items: center; justify-content: center;
      margin-top: -22px;
      border: 5px solid #FAF7F0;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(46,125,50,0.35);
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <!-- Signal -->
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0"   y="5"  width="3" height="7" rx="1" fill="#1A1A1A"/>
        <rect x="4.5" y="3"  width="3" height="9" rx="1" fill="#1A1A1A"/>
        <rect x="9"   y="1"  width="3" height="11" rx="1" fill="#1A1A1A"/>
        <rect x="13.5" y="0" width="3" height="12" rx="1" fill="#1A1A1A" opacity=".3"/>
      </svg>
      <!-- Wifi -->
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
        <path d="M8 2.5C10.5 2.5 12.7 3.5 14.3 5.2L15.5 3.8C13.5 1.7 10.9.5 8 .5S2.5 1.7.5 3.8L1.7 5.2C3.3 3.5 5.5 2.5 8 2.5z" fill="#1A1A1A"/>
        <path d="M8 5.5C9.7 5.5 11.2 6.2 12.3 7.3L13.5 6C12 4.7 10.1 3.9 8 3.9S4 4.7 2.5 6L3.7 7.3C4.8 6.2 6.3 5.5 8 5.5z" fill="#1A1A1A"/>
        <circle cx="8" cy="10" r="2" fill="#1A1A1A"/>
      </svg>
      <!-- Battery -->
      <div style="width:25px;height:12px;border:1.5px solid #1A1A1A;border-radius:3px;padding:2px;display:flex;align-items:center;position:relative;">
        <div style="width:85%;height:100%;background:#1A1A1A;border-radius:1.5px;"></div>
        <div style="position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:3px;height:6px;background:#1A1A1A;border-radius:0 1px 1px 0;"></div>
      </div>
    </div>
  </div>

  <!-- Top bar -->
  <div class="top-bar">
    <button class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="logo-wrap">
      <!-- Logo KALAN arbre -->
      <svg width="32" height="32" viewBox="0 0 60 60" fill="none">
        <path d="M30 4C18 4 10 13 10 23C10 30 14 36 20 40L17 56L30 50L43 56L40 40C46 36 50 30 50 23C50 13 42 4 30 4Z" fill="#5C3D1A"/>
        <circle cx="30" cy="21" r="17" fill="#2E7D32"/>
        <circle cx="18" cy="26" r="11" fill="#2E7D32"/>
        <circle cx="42" cy="26" r="11" fill="#2E7D32"/>
        <circle cx="30" cy="13" r="10" fill="#3B8A30"/>
        <circle cx="22" cy="12" r="6"  fill="#4CAF50"/>
        <circle cx="38" cy="14" r="5"  fill="#4CAF50"/>
        <path d="M32 16L27 24L31 24L27 32L35 22L31 22Z" fill="#FBC02D"/>
        <rect x="24" y="50" width="12" height="4" rx="1.5" fill="#FBC02D"/>
        <line x1="30" y1="50" x2="30" y2="54" stroke="#E07B39" stroke-width="1"/>
      </svg>
      <span class="logo-text">KALAN</span>
    </div>
    <div class="spacer"></div>
  </div>

  <!-- Tab switcher -->
  <div class="tab-bar">
    <button class="tab-btn active">Screenshot</button>
    <button class="tab-btn inactive">Uploader un fichier</button>
  </div>

  <!-- Viewfinder -->
  <div class="viewfinder-wrap">
    <div class="viewfinder">
      <!-- Scan line animation -->
      <div class="scan-line"></div>

      <!-- Corner brackets -->
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <!-- Center icon -->
      <div class="cam-icon-wrap">
        <div class="cam-icon-bg">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Helper text -->
    <div class="helper-text">
      <p>Positionne ton contenu</p>
      <p>et prends une photo</p>
    </div>
  </div>

  <!-- Camera controls -->
  <div class="controls">
    <!-- Flash -->
    <button class="ctrl-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L4.5 13.5H11L9 22L19.5 10.5H13L13 2Z"/>
      </svg>
    </button>

    <!-- Capture -->
    <button class="capture-btn">
      <div class="capture-inner"></div>
    </button>

    <!-- Refresh / flip -->
    <button class="ctrl-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <polyline points="23 20 23 14 17 14"/>
        <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/>
      </svg>
    </button>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span>Accueil</span>
    </div>
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span>Bibliothèque</span>
    </div>

    <!-- Centre camera FAB -->
    <div class="nav-cam-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>

    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
      <span>Decks</span>
    </div>
    <div class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profil</span>
    </div>
  </nav>

</div>

<script>
  // Tab switcher
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active');
        b.classList.add('inactive');
      });
      btn.classList.remove('inactive');
      btn.classList.add('active');
    });
  });

  // Capture button ripple
  document.querySelector('.capture-btn').addEventListener('click', () => {
    const btn = document.querySelector('.capture-btn');
    btn.style.transform = 'scale(0.92)';
    setTimeout(() => btn.style.transform = '', 180);
  });
</script>

</body>
</html>
