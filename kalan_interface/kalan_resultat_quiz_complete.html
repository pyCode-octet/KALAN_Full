<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALAN - Résultat Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #e8e0d0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        :root {
            --color-background-secondary: #e8e0d0;
            --border-radius-lg: 20px;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body>

<div style="display:flex;justify-content:center;background:var(--color-background-secondary);padding:16px;border-radius:var(--border-radius-lg);min-height:700px;">
<div style="width:360px;background:#F5F2EA;border-radius:36px;overflow:hidden;font-family:var(--font-sans);position:relative;min-height:820px;">

  <!-- Status bar -->
  <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 22px 4px;background:#fff;">
    <span style="font-size:13px;font-weight:600;color:#1a1a1a;">9:41</span>
    <div style="display:flex;align-items:center;gap:5px;">
      <svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="4" width="3" height="7" rx="1" fill="#1a1a1a"/><rect x="4.5" y="2.5" width="3" height="8.5" rx="1" fill="#1a1a1a"/><rect x="9" y="0.5" width="3" height="10.5" rx="1" fill="#1a1a1a"/><rect x="13.5" y="0" width="2.5" height="11" rx="1" fill="#1a1a1a" opacity=".3"/></svg>
      <svg width="15" height="12" viewBox="0 0 16 12"><path d="M8 3C10.2 3 12.2 3.9 13.6 5.4L15 4C13.2 2.1 10.7 1 8 1 5.3 1 2.8 2.1 1 4l1.4 1.4C3.8 3.9 5.8 3 8 3z" fill="#1a1a1a"/><path d="M8 6C9.4 6 10.7 6.6 11.6 7.6L13 6.2C11.7 4.8 10 4 8 4s-3.7.8-5 2.2L4.4 7.6C5.3 6.6 6.6 6 8 6z" fill="#1a1a1a"/><circle cx="8" cy="10" r="1.5" fill="#1a1a1a"/></svg>
      <div style="width:22px;height:11px;border:1.5px solid #1a1a1a;border-radius:3px;padding:1.5px;display:flex;align-items:center;">
        <div style="width:75%;height:100%;background:#1a1a1a;border-radius:1.5px;"></div>
      </div>
    </div>
  </div>

  <!-- Title -->
  <div style="padding:14px 20px 6px;text-align:center;background:#fff;">
    <span style="font-size:16px;font-weight:700;color:#1a1a1a;">Résultat du quiz</span>
  </div>

  <!-- Trophy illustration -->
  <div style="display:flex;justify-content:center;padding:24px 0 10px;background:#fff;">
    <div style="position:relative;width:110px;height:110px;">
      <!-- Confetti dots -->
      <div style="position:absolute;top:4px;left:8px;width:7px;height:7px;background:#E07B39;border-radius:50%;"></div>
      <div style="position:absolute;top:2px;right:14px;width:5px;height:5px;background:#2D6A2D;border-radius:50%;"></div>
      <div style="position:absolute;top:14px;right:4px;width:6px;height:6px;background:#FAC775;border-radius:2px;transform:rotate(30deg);"></div>
      <div style="position:absolute;bottom:14px;left:2px;width:5px;height:5px;background:#185FA5;border-radius:50%;"></div>
      <div style="position:absolute;bottom:8px;right:6px;width:6px;height:6px;background:#E24B4A;border-radius:2px;transform:rotate(20deg);"></div>
      <div style="position:absolute;top:30px;left:0;width:4px;height:4px;background:#9FE1CB;border-radius:50%;"></div>
      <div style="position:absolute;top:20px;right:0;width:4px;height:8px;background:#E07B39;border-radius:2px;transform:rotate(15deg);"></div>
      <!-- Trophy SVG -->
      <svg width="110" height="110" viewBox="0 0 110 110">
        <!-- Cup body -->
        <path d="M35 20 Q33 55 55 65 Q77 55 75 20 Z" fill="#FAC775"/>
        <!-- Cup shine -->
        <path d="M42 25 Q40 45 48 56" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".5"/>
        <!-- Handles -->
        <path d="M35 28 Q20 30 22 45 Q24 55 35 52" fill="none" stroke="#EF9F27" stroke-width="5" stroke-linecap="round"/>
        <path d="M75 28 Q90 30 88 45 Q86 55 75 52" fill="none" stroke="#EF9F27" stroke-width="5" stroke-linecap="round"/>
        <!-- Stem -->
        <rect x="49" y="65" width="12" height="14" rx="3" fill="#EF9F27"/>
        <!-- Base -->
        <rect x="38" y="79" width="34" height="8" rx="4" fill="#BA7517"/>
        <!-- Star -->
        <polygon points="55,34 58,44 68,44 60,50 63,60 55,54 47,60 50,50 42,44 52,44" fill="#fff" opacity=".9"/>
      </svg>
    </div>
  </div>

  <!-- Bravo text -->
  <div style="text-align:center;padding:8px 20px 4px;background:#fff;">
    <p style="font-size:26px;font-weight:700;color:#1a1a1a;margin:0 0 4px;">Bravo !</p>
    <p style="font-size:14px;color:#888;margin:0 0 16px;">Tu as obtenu</p>
    <p style="font-size:52px;font-weight:700;color:#2D6A2D;margin:0;line-height:1;">85%</p>
    <p style="font-size:13px;color:#888;margin:10px 0 0;">Tu maîtrises bien ce chapitre 💪</p>
  </div>

  <!-- Stats row -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:22px 16px 16px;background:#fff;">
    <div style="background:#EAF3DE;border-radius:14px;padding:14px;text-align:center;">
      <p style="font-size:11px;color:#3B6D11;margin:0 0 4px;font-weight:500;">Bonnes réponses</p>
      <p style="font-size:30px;font-weight:700;color:#2D6A2D;margin:0;">17</p>
    </div>
    <div style="background:#FCEBEB;border-radius:14px;padding:14px;text-align:center;">
      <p style="font-size:11px;color:#A32D2D;margin:0 0 4px;font-weight:500;">Mauvaises réponses</p>
      <p style="font-size:30px;font-weight:700;color:#E24B4A;margin:0;">3</p>
    </div>
  </div>

  <!-- XP gained -->
  <div style="margin:0 16px 20px;background:#FAEEDA;border-radius:14px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:#fff;">
    <div style="display:flex;align-items:center;gap:8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#BA7517"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
      <span style="font-size:13px;font-weight:600;color:#633806;">Points gagnés</span>
    </div>
    <span style="font-size:16px;font-weight:700;color:#BA7517;">+ 120 XP</span>
  </div>

  <!-- Buttons -->
  <div style="padding:0 16px 90px;display:flex;flex-direction:column;gap:10px;background:#fff;">
    <div style="background:#2D6A2D;border-radius:50px;padding:15px;text-align:center;cursor:pointer;">
      <span style="font-size:15px;font-weight:600;color:#fff;">Voir les réponses</span>
    </div>
    <div style="background:#fff;border-radius:50px;padding:15px;text-align:center;cursor:pointer;border:0.5px solid rgba(0,0,0,0.1);">
      <span style="font-size:15px;font-weight:500;color:#1a1a1a;">Retour à l'accueil</span>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div style="position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid rgba(0,0,0,0.08);padding:10px 0 20px;display:flex;justify-content:space-around;align-items:flex-end;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span style="font-size:10px;color:#aaa;">Accueil</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      <span style="font-size:10px;color:#aaa;">Mes cartes</span>
    </div>
    <div style="width:54px;height:54px;background:#2D6A2D;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;border:3px solid #F5F2EA;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M20.94 11A8.994 8.994 0 0 0 12 3a8.994 8.994 0 0 0-8.94 8"/><path d="M3.06 13A8.994 8.994 0 0 0 12 21a8.994 8.994 0 0 0 8.94-8"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D6A2D" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17" stroke-width="3"/></svg>
      <span style="font-size:10px;color:#2D6A2D;font-weight:600;">Quiz</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size:10px;color:#aaa;">Profil</span>
    </div>
  </div>

</div>
</div>

</body>
</html>
