<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALAN - Récompenses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #e8e0d0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        :root {
            --color-background-secondary: #e8e0d0;
            --border-radius-lg: 20px;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body>

<div style="display:flex;justify-content:center;background:var(--color-background-secondary);padding:16px;border-radius:var(--border-radius-lg);min-height:700px;">
<div style="width:360px;background:#F5F2EA;border-radius:36px;overflow:hidden;font-family:var(--font-sans);position:relative;min-height:820px;">

  <!-- Status bar -->
  <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 22px 4px;background:#fff;">
    <span style="font-size:13px;font-weight:600;color:#1a1a1a;">9:41</span>
    <div style="display:flex;align-items:center;gap:5px;">
      <svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="4" width="3" height="7" rx="1" fill="#1a1a1a"/><rect x="4.5" y="2.5" width="3" height="8.5" rx="1" fill="#1a1a1a"/><rect x="9" y="0.5" width="3" height="10.5" rx="1" fill="#1a1a1a"/><rect x="13.5" y="0" width="2.5" height="11" rx="1" fill="#1a1a1a" opacity=".3"/></svg>
      <svg width="15" height="12" viewBox="0 0 16 12"><path d="M8 3C10.2 3 12.2 3.9 13.6 5.4L15 4C13.2 2.1 10.7 1 8 1 5.3 1 2.8 2.1 1 4l1.4 1.4C3.8 3.9 5.8 3 8 3z" fill="#1a1a1a"/><path d="M8 6C9.4 6 10.7 6.6 11.6 7.6L13 6.2C11.7 4.8 10 4 8 4s-3.7.8-5 2.2L4.4 7.6C5.3 6.6 6.6 6 8 6z" fill="#1a1a1a"/><circle cx="8" cy="10" r="1.5" fill="#1a1a1a"/></svg>
      <div style="width:22px;height:11px;border:1.5px solid #1a1a1a;border-radius:3px;padding:1.5px;display:flex;align-items:center;">
        <div style="width:75%;height:100%;background:#1a1a1a;border-radius:1.5px;"></div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <div style="padding:10px 20px 16px;background:#fff;">
    <p style="font-size:20px;font-weight:700;color:#1a1a1a;margin:0;">Récompenses</p>
  </div>

  <!-- Stats row -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px 20px;background:#fff;">
    <div style="background:#fff;border-radius:14px;padding:12px 8px;text-align:center;border:0.5px solid rgba(0,0,0,0.06);">
      <div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:4px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#BA7517"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
        <span style="font-size:10px;color:#888;font-weight:500;">Points</span>
      </div>
      <p style="font-size:20px;font-weight:700;color:#BA7517;margin:0;">1250</p>
    </div>
    <div style="background:#fff;border-radius:14px;padding:12px 8px;text-align:center;border:0.5px solid rgba(0,0,0,0.06);">
      <div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:4px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E24B4A" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span style="font-size:10px;color:#888;font-weight:500;">Série</span>
      </div>
      <p style="font-size:20px;font-weight:700;color:#E24B4A;margin:0;">7 jours</p>
    </div>
    <div style="background:#fff;border-radius:14px;padding:12px 8px;text-align:center;border:0.5px solid rgba(0,0,0,0.06);">
      <div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:4px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2D6A2D" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span style="font-size:10px;color:#888;font-weight:500;">Niveau</span>
      </div>
      <p style="font-size:20px;font-weight:700;color:#2D6A2D;margin:0;">3</p>
    </div>
  </div>

  <!-- Mes badges -->
  <div style="padding:0 20px 14px;background:#fff;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <p style="font-size:15px;font-weight:700;color:#1a1a1a;margin:0;">Mes badges</p>
      <span style="font-size:12px;color:#2D6A2D;font-weight:500;">Voir tout</span>
    </div>

    <!-- Row 1 -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;">

      <!-- Badge 1: Premier pas -->
      <div style="background:#fff;border-radius:14px;padding:14px 8px;text-align:center;border:0.5px solid rgba(0,0,0,0.06);">
        <div style="width:48px;height:48px;margin:0 auto 8px;background:#EAF3DE;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D6A2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <p style="font-size:11px;font-weight:600;color:#1a1a1a;margin:0;">Premier pas</p>
      </div>

      <!-- Badge 2: Quiz Master -->
      <div style="background:#fff;border-radius:14px;padding:14px 8px;text-align:center;border:0.5px solid rgba(0,0,0,0.06);">
        <div style="width:48px;height:48px;margin:0 auto 8px;background:#EEEDFE;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#534AB7" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17" stroke-width="3"/></svg>
        </div>
        <p style="font-size:11px;font-weight:600;color:#1a1a1a;margin:0;">Quiz Master</p>
      </div>

      <!-- Badge 3: Partageur -->
      <div style="background:#fff;border-radius:14px;padding:14px 8px;text-align:center;border:0.5px solid rgba(0,0,0,0.06);">
        <div style="width:48px;height:48px;margin:0 auto 8px;background:#E6F1FB;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </div>
        <p style="font-size:11px;font-weight:600;color:#1a1a1a;margin:0;">Partageur</p>
      </div>

    </div>

    <!-- Row 2 -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">

      <!-- Badge 4: Assidu -->
      <div style="background:#fff;border-radius:14px;padding:14px 8px;text-align:center;border:0.5px solid rgba(0,0,0,0.06);">
        <div style="width:48px;height:48px;margin:0 auto 8px;background:#FAEEDA;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#854F0B" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <p style="font-size:11px;font-weight:600;color:#1a1a1a;margin:0;">Assidu</p>
      </div>

      <!-- Badge 5: Connaisseur -->
      <div style="background:#fff;border-radius:14px;padding:14px 8px;text-align:center;border:0.5px solid rgba(0,0,0,0.06);">
        <div style="width:48px;height:48px;margin:0 auto 8px;background:#EAF3DE;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2D6A2D" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <p style="font-size:11px;font-weight:600;color:#1a1a1a;margin:0;">Connaisseur</p>
      </div>

      <!-- Badge 6: Champion (locked) -->
      <div style="background:#F1EFE8;border-radius:14px;padding:14px 8px;text-align:center;border:0.5px solid rgba(0,0,0,0.06);opacity:.55;">
        <div style="width:48px;height:48px;margin:0 auto 8px;background:#D3D1C7;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5F5E5A" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <p style="font-size:11px;font-weight:600;color:#888;margin:0;">Champion</p>
      </div>

    </div>
  </div>

  <!-- Progression vers prochain niveau -->
  <div style="margin:8px 16px 20px;background:#fff;border-radius:16px;padding:16px;border:0.5px solid rgba(0,0,0,0.06);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div>
        <p style="font-size:13px;font-weight:600;color:#1a1a1a;margin:0 0 2px;">Niveau 3 → Niveau 4</p>
        <p style="font-size:11px;color:#aaa;margin:0;">1250 / 2000 XP</p>
      </div>
      <div style="width:40px;height:40px;background:#EAF3DE;border-radius:50%;display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D6A2D" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
    </div>
    <div style="height:7px;background:#D8D4C8;border-radius:10px;overflow:hidden;">
      <div style="width:62.5%;height:100%;background:#2D6A2D;border-radius:10px;"></div>
    </div>
    <p style="font-size:11px;color:#2D6A2D;font-weight:500;margin:6px 0 0;text-align:right;">750 XP restants</p>
  </div>

  <!-- Bottom Nav -->
  <div style="position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid rgba(0,0,0,0.08);padding:10px 0 20px;display:flex;justify-content:space-around;align-items:flex-end;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span style="font-size:10px;color:#aaa;">Accueil</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      <span style="font-size:10px;color:#aaa;">Mes cartes</span>
    </div>
    <div style="width:54px;height:54px;background:#2D6A2D;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;border:3px solid #F5F2EA;cursor:pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M20.94 11A8.994 8.994 0 0 0 12 3a8.994 8.994 0 0 0-8.94 8"/><path d="M3.06 13A8.994 8.994 0 0 0 12 21a8.994 8.994 0 0 0 8.94-8"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17" stroke-width="3"/></svg>
      <span style="font-size:10px;color:#aaa;">Quiz</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size:10px;color:#aaa;">Profil</span>
    </div>
  </div>

</div>
</div>

</body>
</html>
